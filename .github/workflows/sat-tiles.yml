name: sat-tiles
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
concurrency: {group: sat-tiles, cancel-in-progress: false}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        layer: ["mtg_fd:vis06_hrfi","mtg_fd:ir105_hrfi","mtg_fd:rgb_dust","msg_iodc:wv062","msg_iodc:rgb_convection"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pillow
      - env:
          SAT_LAYERS: ${{ matrix.layer }}
          SAT_OUT: out
        run: python tools/sat_ingest.py
      - run: echo "name=$(echo '${{ matrix.layer }}' | tr ':' '_')" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: tiles-${{ env.name }}
          path: out/${{ env.name }}
          retention-days: 1
          if-no-files-found: ignore
  publish:
    needs: ingest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: _site_in}
      - run: |
          mkdir -p _site
          for d in _site_in/tiles-*; do n=${d#_site_in/tiles-}; mkdir -p _site/$n; cp -r $d/. _site/$n/; done
          python tools/sat_manifest.py _site
          echo "MetStat satellite tiles (EUMETSAT EUMETView)." > _site/index.html
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: dep
        uses: actions/deploy-pages@v4
